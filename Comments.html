<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
}

/* SIDEBAR */
.sidebar {
  height: 100%;
  width: 0;
  position: fixed;
  z-index: 200;
  top: 0;
  left: 0;
  background-color: rgb(20,20,20);
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidebar a {
  padding: 12px 12px 12px 32px;
  font-size: 20px;
  color: white;
  display: block;
  text-decoration: none;
}

.sidebar a:hover {
  color: #22c022;
}

.closebtn {
  position: absolute;
  top: 0;
  right: 20px;
  font-size: 36px;
}

.openbtn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 300;
  background-color: black;
  color: white;
  font-size: 28px;
  padding: 10px 15px;
  border: none;
  cursor: pointer;
}

.openbtn:hover {
  background-color: white;
  color: black;
}

#page {
  transition: margin-left 0.5s;
}

/* COMMENT SECTION */
.comment-section {
    max-width: 700px;
    margin: 80px auto;
    padding: 20px;
    background-color: rgba(26, 26, 26, 0.9);
    border-radius: 10px;
    border: 8px solid transparent; 
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    position: relative;
    z-index: 1;
}

.comment-section h2 {
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 1px 1px 5px black;
    color: beige;
}

#commentForm {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

#commentForm input,
#commentForm textarea {
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    background-color: #2a2a2a;
    color: white;
}

#commentForm textarea {
    min-height: 100px;
    resize: vertical;
}

#commentForm button {
    background-color: rgb(26, 143, 26);
    color: white;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.25s;
    font-weight: bold;
}

#commentForm button:hover {
    background-color: #22c022;
    box-shadow: 0 0 15px #22c022;
}

.comment {
    background-color: #2b2b2b;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    border-left: 4px solid #22c022;
    color: white;
}

.comment strong {
    color: #22c022;
}

.comment small {
    display: block;
    font-size: 11px;
    opacity: 0.6;
    margin-top: 5px;
    color: white;
}

/* Spinny cat */
#spinnyCat {
    position: fixed;
    width: 150px;
    z-index: 100;
    pointer-events: none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="mySidebar" class="sidebar">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">→</a>
  <a href="Homepage.html">Homepage</a>
  <a href="Main Branches - P.I.E Language Tree.html">Main Branches</a>
  <a href="History.html">History</a>
  <a href="Core Vocab.html">Core Vocab</a>
  <a href="Implementation of JS.html">Implementation of JS and citations!</a>
</div>

<div id="page">
<button class="openbtn" onclick="openNav()">☰</button>

<!-- Spinny Cat -->
<img id="spinnyCat"
src="https://media.tenor.com/KK4MJz2_YRgAAAAi/cat-spinning.gif">

<!-- COMMENT SECTION -->
<div class="comment-section" id="commentSection">
    <h2>
        Hey there! Leave a comment in this page if you'd like. 
        If not, that's alright. Glad you enjoyed the website! 
        It took time, and it may not be the best, but we for sure tried.
    </h2>

    <form id="commentForm">
        <input type="text" name="username" placeholder="Enter your username (optional)" />
        <textarea name="comment" placeholder="Write your comment..."></textarea>
        <button type="submit">Post</button>
    </form>

    <div id="comments"></div>
</div>

</div>

<script>
/* SIDEBAR */
function openNav() {
  document.getElementById("mySidebar").style.width = "250px";
  document.getElementById("page").style.marginLeft = "250px";
}
function closeNav() {
  document.getElementById("mySidebar").style.width = "0";
  document.getElementById("page").style.marginLeft = "0";
}

/* NEON SPECTRUM BACKGROUND */
const commentSection = document.getElementById('commentSection');
let hue = 0;
setInterval(() => {
    hue = (hue + 2) % 360;
    const neonColor = `hsl(${hue}, 100%, 50%)`;
    document.body.style.backgroundColor = neonColor;
    commentSection.style.borderColor = neonColor;
    commentSection.style.boxShadow = `0 0 40px ${neonColor}`;
}, 20);

/* BOUNCING CAT */
const nyan = document.getElementById('spinnyCat');
let posX = Math.random() * (window.innerWidth - 150);
let posY = Math.random() * (window.innerHeight - 100);
let speedX = 4;
let speedY = 4;

function animateNyan() {
    const w = nyan.offsetWidth;
    const h = nyan.offsetHeight;

    posX += speedX;
    posY += speedY;

    if (posX + w >= window.innerWidth || posX <= 0) {
        speedX *= -1;
        nyan.style.transform = speedX > 0 ? "scaleX(1)" : "scaleX(-1)";
    }

    if (posY + h >= window.innerHeight || posY <= 0) {
        speedY *= -1;
    }

    nyan.style.left = posX + "px";
    nyan.style.top = posY + "px";

    requestAnimationFrame(animateNyan);
}
animateNyan();

/* COMMENTS WITH LOCAL STORAGE */
const commentForm = document.getElementById('commentForm');
const commentsContainer = document.getElementById('comments');
let commentsData = JSON.parse(localStorage.getItem('pieComments')) || [];

function saveComments() {
    localStorage.setItem('pieComments', JSON.stringify(commentsData));
}

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, m => ({
        '&': "&amp;",
        '<': "&lt;",
        '>': "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[m]);
}

function loadComments() {
    commentsContainer.innerHTML = commentsData
        .map(c => `
            <div class="comment">
                <strong>${escapeHTML(c.username)}</strong>
                <p>${escapeHTML(c.text)}</p>
                <small>${c.date}</small>
            </div>
        `).join('');
}

commentForm.addEventListener('submit', e => {
    e.preventDefault();
    const username = e.target.username.value.trim() || "anonymous";
    const comment = e.target.comment.value.trim();
    if (!comment) {
        alert("Comment cannot be empty!");
        return;
    }
    commentsData.unshift({
        username,
        text: comment,
        date: new Date().toLocaleString()
    });
    saveComments();
    loadComments();
    commentForm.reset();
});

loadComments();
</script>

</body>
</html>
